name: Test Reusable IIS Deploy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      release_id: ${{ steps.release.outputs.release_id }}

    steps:
      - name: Set Release ID
        id: release
        run: |
          echo "release_id=123" >> "$GITHUB_OUTPUT"

      - name: Create Test Artifact
        run: |
          mkdir publish
          echo "Hello from reusable workflow" > publish/test.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cicd-demo
          path: ./publish

  call-deploy:
    needs: build

    uses: ./.github/workflows/deploy-iis.yml

    with:
      environment: staging
      release_id: ${{ needs.build.outputs.release_id }}
      site_name: cicd-demo-staging
      app_pool_name: cicd-demo-staging
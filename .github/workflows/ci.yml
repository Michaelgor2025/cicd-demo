name: .NET CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      release_id:
        description: '要部署的 Release ID'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      release_id: ${{ steps.release.outputs.release_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test ./cicd-demo.Tests/cicd-demo.Tests.csproj

      - name: Publish
        run: dotnet publish -c Release -o ./publish
        
      - name: Set Release ID
        id: release
        run: |
          echo "release_id=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Create Release Manifest
        shell: bash
        run: |
          cat > ./publish/release.json <<EOF
          {
            "releaseId": "${{ steps.release.outputs.release_id }}",
            "commitSha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "workflowRunId": "${{ github.run_id }}",
            "createdBy": "${{ github.actor }}",
            "createdAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

          cat ./publish/release.json

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cicd-demo
          path: ./publish

  deploy-staging:
    needs: build

    # 只有 push 到 main 才部署 Staging
    # PR 只做 CI，不部署服务器
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    concurrency:
      group: cicd-demo-staging
      cancel-in-progress: true

    uses: ./.github/workflows/deploy-iis.yml

    with:
      environment: staging
      release_id: ${{ needs.build.outputs.release_id }}
      site_name: cicd-demo-staging
      app_pool_name: cicd-demo-staging    
      enable_rollback: false
      keep_releases: 3

    secrets: inherit

  deploy-production:
    needs:
      - build
      - deploy-staging

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    concurrency:
      group: cicd-demo
      cancel-in-progress: false

    uses: ./.github/workflows/deploy-iis.yml

    with:
      environment: production
      release_id: ${{ needs.build.outputs.release_id }}
      site_name: cicd-demo
      app_pool_name: cicd-demo
      deploy_existing_release: false
      enable_rollback: true
      keep_releases: 3
      
  deploy-production-manual:
    if: github.event_name == 'workflow_dispatch'

    concurrency:
      group: cicd-demo-production
      cancel-in-progress: false

    uses: ./.github/workflows/deploy-iis.yml

    with:
      environment: production
      release_id: ${{ inputs.release_id }}
      site_name: cicd-demo
      app_pool_name: cicd-demo
      deploy_existing_release: true
      enable_rollback: true
      keep_releases: 3
name: .NET CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test ./cicd-demo.Tests/cicd-demo.Tests.csproj

      - name: Publish
        run: dotnet publish -c Release -o ./publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cicd-demo
          path: ./publish

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      # 1. 下载 build Job 生成的 Artifact
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: cicd-demo
          path: ./deploy

      # 2. 创建部署目录
      - name: Prepare Deploy Directory
        shell: powershell
        run: |
          $deployPath = "C:\Deploy\cicd-demo"

          Write-Host "Deploy path: $deployPath"

          if (-not (Test-Path $deployPath)) {
              New-Item -ItemType Directory -Path $deployPath -Force
              Write-Host "Created deploy directory."
          }
          else {
              Write-Host "Deploy directory already exists."
          }

      # 3. 复制 Artifact
      - name: Copy Artifact
        shell: powershell
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "deploy"
          $target = "C:\Deploy\cicd-demo"

          Write-Host "Source: $source"
          Write-Host "Target: $target"

          Copy-Item `
            -Path "$source\*" `
            -Destination $target `
            -Recurse `
            -Force

      # 4. 验证部署文件
      - name: Verify Deployment Files
        shell: powershell
        run: |
          Write-Host "================================="
          Write-Host "Deployment Files"
          Write-Host "================================="

          Get-ChildItem `
            -Path "C:\Deploy\cicd-demo" `
            -Recurse
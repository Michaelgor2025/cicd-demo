name: .NET CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      release_id: ${{ steps.release.outputs.release_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show GitHub Context
        run: |
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Event: ${{ github.event_name }}"

      - name: IF - Main Branch
        if: github.ref == 'refs/heads/main'
        run: echo "This is main branch"

      - name: IF - Not Main Branch
        if: github.ref != 'refs/heads/main'
        run: echo "This is NOT main branch"

      - name: IF - Pull Request
        if: github.event_name == 'pull_request'
        run: echo "This is a Pull Request"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test ./cicd-demo.Tests/cicd-demo.Tests.csproj

      - name: Publish
        run: dotnet publish -c Release -o ./publish

      - name: Set Release ID
        id: release
        run: |
          echo "release_id=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cicd-demo
          path: ./publish

  test-needs-build:
    runs-on: ubuntu-latest
    steps:
      - name: Test
        run: |
          echo "This job will fail"
          exit 1

  test-deploy-staging:
    needs: test-needs-build
    runs-on: ubuntu-latest
    steps:
      - run: echo "Staging"

  test-deploy-production:
    needs: test-deploy-staging
    runs-on: ubuntu-latest
    steps:
      - run: echo "Production"

  test-notification:
    needs: test-needs-build
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - run: echo "Build failed! Send notification here."
  
  test-output:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.set-version.outputs.version }}

    steps:
      - name: Set Version
        id: set-version
        run: |
          echo "version=2026.09.17" >> "$GITHUB_OUTPUT"

  test-output-consumer:
    needs: test-output
    runs-on: ubuntu-latest

    steps:
      - name: Read Version
        run: |
          echo "Received version: ${{ needs.test-output.outputs.version }}"

  test-matrix:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        dotnet-version: ['8.0.x', '9.0.x', '10.0.x']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Show Version
        run: dotnet --version

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test ./cicd-demo.Tests/cicd-demo.Tests.csproj --no-build

  deploy-staging:
    needs: build

    # 只有 push 到 main 才部署 Staging
    # PR 只做 CI，不部署服务器
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    concurrency:
      group: cicd-demo-staging
      cancel-in-progress: true

    uses: ./.github/workflows/deploy-iis.yml

    with:
      environment: staging
      release_id: ${{ needs.build.outputs.release_id }}
      site_name: cicd-demo-staging
      app_pool_name: cicd-demo-staging    
      enable_rollback: false
      keep_releases: 3

  deploy-production:
    needs:
      - build
      - deploy-staging

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    concurrency:
      group: cicd-demo
      cancel-in-progress: false

    uses: ./.github/workflows/deploy-iis.yml

    with:
      environment: production
      release_id: ${{ needs.build.outputs.release_id }}
      site_name: cicd-demo
      app_pool_name: cicd-demo
      enable_rollback: true
      keep_releases: 3
      
name: .NET CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test ./cicd-demo.Tests/cicd-demo.Tests.csproj

      - name: Publish
        run: dotnet publish -c Release -o ./publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cicd-demo
          path: ./publish

  deploy:
    needs: build
    runs-on: self-hosted

    steps:

      # ========================================
      # 1. 下载 CI 阶段生成的 Artifact
      # ========================================
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: cicd-demo
          path: ./deploy


      # ========================================
      # 2. 停止 IIS AppPool
      # ========================================
      - name: Stop IIS AppPool
        shell: powershell
        run: |
          Import-Module WebAdministration

          $appPoolName = "cicd-demo"

          $state = (Get-WebAppPoolState -Name $appPoolName).Value

          Write-Host "Current AppPool state: $state"

          if ($state -eq "Started") {

              Stop-WebAppPool -Name $appPoolName

              Write-Host "Stopping AppPool..."

              $timeout = 30
              $elapsed = 0

              do {
                  Start-Sleep -Seconds 1
                  $elapsed++

                  $state = (Get-WebAppPoolState -Name $appPoolName).Value

                  Write-Host "Current AppPool state: $state"

              } while ($state -ne "Stopped" -and $elapsed -lt $timeout)

              if ($state -ne "Stopped") {
                  throw "AppPool failed to stop within $timeout seconds."
              }
          }
          else {
              Write-Host "AppPool is already stopped. Continue deployment."
          }

          Write-Host "AppPool is ready for deployment."


      # ========================================
      # 3. 创建新的 Release
      # ========================================
      - name: Deploy Files
        shell: powershell
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "deploy"

          $basePath = "C:\Deploy\cicd-demo"
          $releasesPath = Join-Path $basePath "releases"

          $releaseId = "${{ github.run_number }}"
          $releasePath = Join-Path $releasesPath $releaseId

          Write-Host "Source: $source"
          Write-Host "Release: $releasePath"

          # 创建 Release 目录
          New-Item `
            -ItemType Directory `
            -Path $releasePath `
            -Force | Out-Null

          # 复制 Artifact
          Copy-Item `
            -Path "$source\*" `
            -Destination $releasePath `
            -Recurse `
            -Force

          Write-Host "Release files copied."

          # 验证关键文件
          $webConfig = Join-Path $releasePath "web.config"

          if (-not (Test-Path $webConfig)) {
              throw "web.config not found: $releasePath"
          }

          Write-Host "Release validation passed."


      # ========================================
      # 4. IIS 切换到新 Release
      # ========================================
      - name: Switch IIS to New Release
        shell: powershell
        run: |
          Import-Module WebAdministration

          $basePath = "C:\Deploy\cicd-demo"

          $releaseId = "${{ github.run_number }}"
          $releasePath = Join-Path $basePath "releases\$releaseId"

          $siteName = "cicd-demo"

          # 获取当前 IIS 路径
          $oldPath = (Get-ItemProperty `
            "IIS:\Sites\$siteName").physicalPath

          Write-Host "Old IIS path: $oldPath"
          Write-Host "New IIS path: $releasePath"

          # 保存旧版本路径
          "OLD_RELEASE_PATH=$oldPath" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Append

          if (-not (Test-Path $releasePath)) {
              throw "Release directory does not exist: $releasePath"
          }

          # 修改 IIS physicalPath
          Set-ItemProperty `
            "IIS:\Sites\$siteName" `
            -Name physicalPath `
            -Value $releasePath

          Write-Host "IIS switched successfully."

          # 验证
          $currentPath = (Get-ItemProperty `
            "IIS:\Sites\$siteName").physicalPath

          Write-Host "Current IIS path: $currentPath"

          if ($currentPath -ne $releasePath) {
              throw "IIS physical path verification failed."
          }


      # ========================================
      # 5. 启动 IIS AppPool
      # ========================================
      - name: Start IIS AppPool
        shell: powershell
        run: |
          Import-Module WebAdministration

          $appPoolName = "cicd-demo"

          $state = (Get-WebAppPoolState -Name $appPoolName).Value

          Write-Host "Current AppPool state: $state"

          if ($state -ne "Started") {

              Start-WebAppPool -Name $appPoolName

              Write-Host "Starting AppPool..."

              $timeout = 30
              $elapsed = 0

              do {
                  Start-Sleep -Seconds 1
                  $elapsed++

                  $state = (Get-WebAppPoolState -Name $appPoolName).Value

                  Write-Host "Current AppPool state: $state"

              } while ($state -ne "Started" -and $elapsed -lt $timeout)

              if ($state -ne "Started") {
                  throw "AppPool failed to start within $timeout seconds."
              }
          }

          Write-Host "AppPool is running."


      # ========================================
      # 6. 检查 AppPool
      # ========================================
      - name: Verify IIS AppPool
        shell: powershell
        run: |
          Import-Module WebAdministration

          $state = (Get-WebAppPoolState `
            -Name "cicd-demo").Value

          Write-Host "AppPool State: $state"

          if ($state -ne "Started") {
              throw "IIS AppPool failed to start."
          }


      # ========================================
      # 7. HTTP 健康检查
      # ========================================
      - name: Health Check
        shell: powershell
        run: |
          $url = "http://localhost:8080/health"

          Write-Host "Checking: $url"

          $maxAttempts = 10
          $attempt = 0
          $success = $false

          while ($attempt -lt $maxAttempts) {

              $attempt++

              try {

                  $response = Invoke-WebRequest `
                    -Uri $url `
                    -UseBasicParsing `
                    -TimeoutSec 5

                  Write-Host "HTTP Status: $($response.StatusCode)"

                  if ($response.StatusCode -eq 200) {
                      $success = $true
                      break
                  }

              }
              catch {

                  Write-Host "Health check failed:"
                  Write-Host $_.Exception.Message
              }

              Write-Host "Waiting for application..."
              Start-Sleep -Seconds 2
          }

          if (-not $success) {
              throw "Health check failed after $maxAttempts attempts."
          }

          Write-Host "Health check passed."


      # ========================================
      # 8. 发布失败 → 回滚 IIS
      # ========================================
      - name: Rollback IIS
        if: failure()
        shell: powershell
        run: |
          Import-Module WebAdministration

          $siteName = "cicd-demo"
          $oldPath = $env:OLD_RELEASE_PATH

          Write-Host "Deployment failed."
          Write-Host "Rollback target: $oldPath"

          if ([string]::IsNullOrWhiteSpace($oldPath)) {
              Write-Warning "Old release path is empty. Cannot rollback."
              exit 0
          }

          if (-not (Test-Path $oldPath)) {
              Write-Warning "Old release does not exist: $oldPath"
              exit 0
          }

          # 停止 AppPool
          $state = (Get-WebAppPoolState `
            -Name $siteName).Value

          if ($state -eq "Started") {
              Stop-WebAppPool -Name $siteName

              Start-Sleep -Seconds 2
          }

          # IIS 切回旧版本
          Write-Host "Switching IIS back to:"
          Write-Host $oldPath

          Set-ItemProperty `
            "IIS:\Sites\$siteName" `
            -Name physicalPath `
            -Value $oldPath

          # 启动 AppPool
          Write-Host "Starting AppPool..."

          Start-WebAppPool -Name $siteName

          Write-Host "Rollback completed."


      # ========================================
      # 9. 无论成功失败，最终确保 AppPool Running
      # ========================================
      - name: Ensure IIS AppPool Running
        if: always()
        shell: powershell
        run: |
          Import-Module WebAdministration

          $appPoolName = "cicd-demo"

          $state = (Get-WebAppPoolState `
            -Name $appPoolName).Value

          Write-Host "Final AppPool state: $state"

          if ($state -ne "Started") {

              Write-Host "AppPool is not running. Attempting to start..."

              try {

                  Start-WebAppPool -Name $appPoolName

              }
              catch {

                  Write-Warning "Failed to start AppPool:"
                  Write-Warning $_.Exception.Message

                  exit 0
              }

              $timeout = 30
              $elapsed = 0

              do {

                  Start-Sleep -Seconds 1
                  $elapsed++

                  $state = (Get-WebAppPoolState `
                    -Name $appPoolName).Value

                  Write-Host "Current AppPool state: $state"

              } while ($state -ne "Started" -and $elapsed -lt $timeout)

              if ($state -ne "Started") {

                  Write-Warning `
                    "AppPool could not be started within $timeout seconds."

                  exit 0
              }
          }

          Write-Host "Final AppPool state: Started."

      # ========================================
      # 10. 清理旧 Release
      # ========================================
      - name: Cleanup Old Releases
        shell: powershell
        run: |
          Import-Module WebAdministration

          $basePath = "C:\Deploy\cicd-demo"
          $releasesPath = Join-Path $basePath "releases"

          $siteName = "cicd-demo"
          $keepCount = 3

          Write-Host "Release directory: $releasesPath"
          Write-Host "Keep latest $keepCount releases."

          if (-not (Test-Path $releasesPath)) {
              Write-Host "Release directory does not exist."
              exit 0
          }

          # ----------------------------------------
          # 获取 IIS 当前正在使用的目录
          # ----------------------------------------
          $currentPath = (Get-ItemProperty `
            "IIS:\Sites\$siteName").physicalPath

          Write-Host "Current IIS path: $currentPath"

          # ----------------------------------------
          # 获取所有 Release
          # ----------------------------------------
          $releases = Get-ChildItem `
            -Path $releasesPath `
            -Directory |
            Sort-Object {
                [int64]$_.Name
            } -Descending

          Write-Host ""
          Write-Host "All releases:"

          $releases | ForEach-Object {
              Write-Host "  $($_.Name)"
          }

          # ----------------------------------------
          # 最新 N 个版本
          # ----------------------------------------
          $releasesToKeep = @(
              $releases | Select-Object -First $keepCount
          )

          # ----------------------------------------
          # 当前 IIS 使用的 Release
          # ----------------------------------------
          foreach ($release in $releases) {

              if ($currentPath.TrimEnd('\') -eq `
                  $release.FullName.TrimEnd('\')) {

                  if ($releasesToKeep.FullName -notcontains $release.FullName) {

                      Write-Host "Keeping current IIS release: $($release.Name)"

                      $releasesToKeep += $release
                  }
              }
          }

          Write-Host ""
          Write-Host "Releases to keep:"

          $releasesToKeep | ForEach-Object {
              Write-Host "  $($_.Name)"
          }

          # ----------------------------------------
          # 删除其他 Release
          # ----------------------------------------
          foreach ($release in $releases) {

              if ($releasesToKeep.FullName -contains $release.FullName) {
                  continue
              }

              Write-Host ""
              Write-Host "Deleting old release: $($release.FullName)"

              Remove-Item `
                -Path $release.FullName `
                -Recurse `
                -Force
          }

          Write-Host ""
          Write-Host "Release cleanup completed."

      # ========================================
      # 11. 输出部署结果
      # ========================================
      - name: Deployment Summary
        shell: powershell
        run: |
          $releaseId = "${{ github.run_number }}"
          $releasePath = "C:\Deploy\cicd-demo\releases\$releaseId"

          Import-Module WebAdministration

          $siteName = "cicd-demo"

          $currentPath = (Get-ItemProperty `
            "IIS:\Sites\$siteName").physicalPath

          $appPoolState = (Get-WebAppPoolState `
            -Name $siteName).Value

          Write-Host ""
          Write-Host "========================================"
          Write-Host "        Deployment Summary"
          Write-Host "========================================"
          Write-Host "Application : cicd-demo"
          Write-Host "Release     : $releaseId"
          Write-Host "IIS Path    : $currentPath"
          Write-Host "AppPool     : $appPoolState"
          Write-Host "Health      : Passed"
          Write-Host "========================================"
          Write-Host ""

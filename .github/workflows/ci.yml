name: .NET CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test ./cicd-demo.Tests/cicd-demo.Tests.csproj

      - name: Publish
        run: dotnet publish -c Release -o ./publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cicd-demo
          path: ./publish

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      # 1. 下载 build Job 生成的 Artifact
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: cicd-demo
          path: ./deploy

      # 2. 查看部署文件
      - name: Show files
        shell: powershell
        run: |
          Write-Host "================================="
          Write-Host "Windows Server Deployment"
          Write-Host "================================="

          Write-Host "Computer Name:"
          Write-Host $env:COMPUTERNAME

          Write-Host ""
          Write-Host "Current User:"
          Write-Host $env:USERNAME

          Write-Host ""
          Write-Host "Current Directory:"
          Get-Location

          Write-Host ""
          Write-Host "Artifact Files:"
          Get-ChildItem -Path .\deploy -Recurse
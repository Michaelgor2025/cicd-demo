name: .NET CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test ./cicd-demo.Tests/cicd-demo.Tests.csproj

      - name: Publish
        run: dotnet publish -c Release -o ./publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cicd-demo
          path: ./publish

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: cicd-demo
          path: ./deploy

      - name: Stop IIS AppPool
        shell: powershell
        run: |
          Import-Module WebAdministration

          $appPoolName = "cicd-demo"

          $state = (Get-WebAppPoolState -Name $appPoolName).Value

          Write-Host "Current AppPool state: $state"

          if ($state -eq "Started") {
              Stop-WebAppPool -Name $appPoolName

              Write-Host "Stopping AppPool..."

              # 等待最多 30 秒
              $timeout = 30
              $elapsed = 0

              do {
                  Start-Sleep -Seconds 1
                  $elapsed++

                  $state = (Get-WebAppPoolState -Name $appPoolName).Value

                  Write-Host "Current AppPool state: $state"

              } while ($state -ne "Stopped" -and $elapsed -lt $timeout)

              if ($state -ne "Stopped") {
                  throw "AppPool failed to stop within $timeout seconds."
              }
          }
          else {
              Write-Host "AppPool is already stopped. Continue deployment."
          }

          Write-Host "AppPool is ready for deployment."

      - name: Deploy Files
        shell: powershell
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "deploy"
          $target = "C:\Deploy\cicd-demo"

          Write-Host "Source: $source"
          Write-Host "Target: $target"

          if (Test-Path $target) {
              Remove-Item "$target\*" -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $target `
            -Force | Out-Null

          Copy-Item `
            -Path "$source\*" `
            -Destination $target `
            -Recurse `
            -Force

          Write-Host "Files deployed."

      - name: Start IIS AppPool
        shell: powershell
        run: |
          Import-Module WebAdministration

          $appPoolName = "cicd-demo"

          $state = (Get-WebAppPoolState -Name $appPoolName).Value

          Write-Host "Current AppPool state: $state"

          if ($state -ne "Started") {
              Start-WebAppPool -Name $appPoolName

              Write-Host "Starting AppPool..."

              $timeout = 30
              $elapsed = 0

              do {
                  Start-Sleep -Seconds 1
                  $elapsed++

                  $state = (Get-WebAppPoolState -Name $appPoolName).Value

                  Write-Host "Current AppPool state: $state"

              } while ($state -ne "Started" -and $elapsed -lt $timeout)

              if ($state -ne "Started") {
                  throw "AppPool failed to start within $timeout seconds."
              }
          }

          Write-Host "AppPool is running."

      - name: Verify IIS AppPool
        shell: powershell
        run: |
          Import-Module WebAdministration

          $pool = Get-WebAppPoolState -Name "cicd-demo"

          Write-Host "AppPool State: $($pool.Value)"

          if ($pool.Value -ne "Started") {
              throw "IIS AppPool failed to start."
          }

          Write-Host "Deployment successful."
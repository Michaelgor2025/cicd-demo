name: .NET CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test ./cicd-demo.Tests/cicd-demo.Tests.csproj

      - name: Publish
        run: dotnet publish -c Release -o ./publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cicd-demo
          path: ./publish

  deploy-staging:
    needs: build

    # 只有 push 到 main 才部署 Staging
    # PR 只做 CI，不部署服务器
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: self-hosted

    steps:
      # 1. 下载 build job 产生的 Artifact
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: cicd-demo
          path: ./deploy

      # 2. 停止 Staging AppPool
      - name: Stop Staging AppPool
        shell: powershell
        run: |
          Import-Module WebAdministration

          $appPoolName = "cicd-demo-staging"

          $state = (Get-WebAppPoolState -Name $appPoolName).Value

          if ($state -eq "Started") {
              Write-Host "Stopping AppPool: $appPoolName"

              Stop-WebAppPool -Name $appPoolName

              $timeout = 30
              $elapsed = 0

              do {
                  Start-Sleep -Seconds 1
                  $elapsed++

                  $state = (Get-WebAppPoolState -Name $appPoolName).Value
              } while ($state -ne "Stopped" -and $elapsed -lt $timeout)

              if ($state -ne "Stopped") {
                  throw "AppPool did not stop within $timeout seconds."
              }
          }
          else {
              Write-Host "AppPool is already stopped."
          }

      # 3. 创建新的 Release
      - name: Deploy Staging Files
        shell: powershell
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "deploy"

          $basePath = "C:\Deploy\cicd-demo-staging"
          $releasesPath = Join-Path $basePath "releases"

          $releaseId = "${{ github.run_number }}"
          $releasePath = Join-Path $releasesPath $releaseId

          Write-Host "Source: $source"
          Write-Host "Release: $releasePath"

          New-Item `
            -ItemType Directory `
            -Path $releasePath `
            -Force | Out-Null

          Copy-Item `
            -Path "$source\*" `
            -Destination $releasePath `
            -Recurse `
            -Force

          # 验证 web.config
          $webConfig = Join-Path $releasePath "web.config"

          if (-not (Test-Path $webConfig)) {
              throw "web.config not found: $releasePath"
          }

          Write-Host "Staging release validation passed."

      # 4. 修改 Staging IIS Site 指向新的 Release
      - name: Switch Staging IIS
        shell: powershell
        run: |
          Import-Module WebAdministration

          $siteName = "cicd-demo-staging"

          $basePath = "C:\Deploy\cicd-demo-staging"
          $releaseId = "${{ github.run_number }}"

          $releasePath = Join-Path `
            $basePath `
            "releases\$releaseId"

          # 保存旧版本路径
          $oldPath = (Get-ItemProperty `
            "IIS:\Sites\$siteName").physicalPath

          Write-Host "Old IIS path: $oldPath"
          Write-Host "New IIS path: $releasePath"

          "OLD_STAGING_RELEASE_PATH=$oldPath" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append

          # 切换 IIS
          Set-ItemProperty `
            "IIS:\Sites\$siteName" `
            -Name physicalPath `
            -Value $releasePath

          # 再读一次验证
          $currentPath = (Get-ItemProperty `
            "IIS:\Sites\$siteName").physicalPath

          if ($currentPath -ne $releasePath) {
              throw "Staging IIS physical path verification failed."
          }

          Write-Host "Staging IIS switch successful."

      # 5. 启动 Staging AppPool
      - name: Start Staging AppPool
        shell: powershell
        run: |
          Import-Module WebAdministration

          $appPoolName = "cicd-demo-staging"

          Start-WebAppPool -Name $appPoolName

          $timeout = 30
          $elapsed = 0

          do {
              Start-Sleep -Seconds 1
              $elapsed++

              $state = (Get-WebAppPoolState `
                -Name $appPoolName).Value

          } while ($state -ne "Started" -and $elapsed -lt $timeout)

          if ($state -ne "Started") {
              throw "Staging AppPool did not start."
          }

          Write-Host "Staging AppPool started."

      # 6. Staging 健康检查
      - name: Staging Health Check
        shell: powershell
        run: |
          $url = "http://localhost:8081/health"

          $maxAttempts = 10
          $attempt = 0
          $success = $false

          while ($attempt -lt $maxAttempts) {
              $attempt++

              Write-Host "Health check attempt: $attempt"

              try {
                  $response = Invoke-WebRequest `
                    -Uri $url `
                    -UseBasicParsing `
                    -TimeoutSec 5

                  if ($response.StatusCode -eq 200) {
                      $success = $true
                      break
                  }
              }
              catch {
                  Write-Host "Health check failed:"
                  Write-Host $_.Exception.Message
              }

              Start-Sleep -Seconds 2
          }

          if (-not $success) {
              throw "Staging health check failed."
          }

          Write-Host "Staging health check passed."

      # 7. 部署结果
      - name: Staging Deployment Summary
        shell: powershell
        run: |
          Import-Module WebAdministration

          $siteName = "cicd-demo-staging"
          $releaseId = "${{ github.run_number }}"

          $currentPath = (Get-ItemProperty `
            "IIS:\Sites\$siteName").physicalPath

          $appPoolState = (Get-WebAppPoolState `
            -Name $siteName).Value

          Write-Host ""
          Write-Host "========================================"
          Write-Host "       Staging Deployment"
          Write-Host "========================================"
          Write-Host "Application : cicd-demo"
          Write-Host "Environment : Staging"
          Write-Host "Release     : $releaseId"
          Write-Host "IIS Path    : $currentPath"
          Write-Host "AppPool     : $appPoolState"
          Write-Host "Health      : Passed"
          Write-Host "========================================"

  deploy-production:
    needs: deploy-staging

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: self-hosted

    environment:
      name: production

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: cicd-demo
          path: ./deploy

      - name: Stop Production AppPool
        shell: powershell
        run: |
          Import-Module WebAdministration

          $appPoolName = "cicd-demo"

          $state = (Get-WebAppPoolState `
            -Name $appPoolName).Value

          if ($state -eq "Started") {

              Write-Host "Stopping Production AppPool..."

              Stop-WebAppPool `
                -Name $appPoolName

              $timeout = 30
              $elapsed = 0

              do {
                  Start-Sleep -Seconds 1
                  $elapsed++

                  $state = (Get-WebAppPoolState `
                    -Name $appPoolName).Value

              } while (
                  $state -ne "Stopped" `
                  -and $elapsed -lt $timeout
              )

              if ($state -ne "Stopped") {
                  throw "Production AppPool did not stop."
              }
          }
          else {
              Write-Host "Production AppPool already stopped."
          }

      - name: Deploy Production Files
        shell: powershell
        run: |
          $source = Join-Path `
            $env:GITHUB_WORKSPACE `
            "deploy"

          $basePath = "C:\Deploy\cicd-demo"

          $releasesPath = Join-Path `
            $basePath `
            "releases"

          $releaseId = "${{ github.run_number }}"

          $releasePath = Join-Path `
            $releasesPath `
            $releaseId

          Write-Host "Production Release:"
          Write-Host $releasePath

          New-Item `
            -ItemType Directory `
            -Path $releasePath `
            -Force | Out-Null

          Copy-Item `
            -Path "$source\*" `
            -Destination $releasePath `
            -Recurse `
            -Force

          $webConfig = Join-Path `
            $releasePath `
            "web.config"

          if (-not (Test-Path $webConfig)) {
              throw "web.config not found."
          }

          Write-Host "Production release validation passed."

      - name: Switch Production IIS
        shell: powershell
        run: |
          Import-Module WebAdministration

          $siteName = "cicd-demo"

          $basePath = "C:\Deploy\cicd-demo"

          $releaseId = "${{ github.run_number }}"

          $releasePath = Join-Path `
            $basePath `
            "releases\$releaseId"

          $oldPath = (Get-ItemProperty `
            "IIS:\Sites\$siteName").physicalPath

          Write-Host "Old Production Path:"
          Write-Host $oldPath

          Write-Host "New Production Path:"
          Write-Host $releasePath

          "OLD_PRODUCTION_RELEASE_PATH=$oldPath" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append

          Set-ItemProperty `
            "IIS:\Sites\$siteName" `
            -Name physicalPath `
            -Value $releasePath

          $currentPath = (Get-ItemProperty `
            "IIS:\Sites\$siteName").physicalPath

          if ($currentPath -ne $releasePath) {
              throw "Production IIS switch failed."
          }

          Write-Host "Production IIS switched successfully."

      - name: Start Production AppPool
        shell: powershell
        run: |
          Import-Module WebAdministration

          $appPoolName = "cicd-demo"

          Start-WebAppPool `
            -Name $appPoolName

          $timeout = 30
          $elapsed = 0

          do {
              Start-Sleep -Seconds 1
              $elapsed++

              $state = (Get-WebAppPoolState `
                -Name $appPoolName).Value

          } while (
              $state -ne "Started" `
              -and $elapsed -lt $timeout
          )

          if ($state -ne "Started") {
              throw "Production AppPool did not start."
          }

          Write-Host "Production AppPool started."

      - name: Production Health Check
        shell: powershell
        run: |
          $url = "http://localhost:8080/health"

          $maxAttempts = 10
          $attempt = 0
          $success = $false

          while ($attempt -lt $maxAttempts) {

              $attempt++

              Write-Host "Production health check: $attempt"

              try {

                  $response = Invoke-WebRequest `
                    -Uri $url `
                    -UseBasicParsing `
                    -TimeoutSec 5

                  if ($response.StatusCode -eq 200) {
                      $success = $true
                      break
                  }

              }
              catch {

                  Write-Host $_.Exception.Message
              }

              Start-Sleep -Seconds 2
          }

          if (-not $success) {
              throw "Production health check failed."
          }

          Write-Host "Production health check passed."

      - name: Rollback Production
        if: failure()
        shell: powershell
        run: |
          Import-Module WebAdministration

          $siteName = "cicd-demo"
          $oldPath = $env:OLD_PRODUCTION_RELEASE_PATH

          Write-Host "========================================"
          Write-Host "       Production Rollback"
          Write-Host "========================================"

          if ([string]::IsNullOrWhiteSpace($oldPath)) {
              Write-Warning "Old production path is empty."
              Write-Warning "Cannot rollback."
              exit 0
          }

          Write-Host "Rollback target:"
          Write-Host $oldPath

          if (-not (Test-Path $oldPath)) {
              Write-Warning "Old release does not exist:"
              Write-Warning $oldPath
              exit 0
          }

          # 获取当前 AppPool 状态
          $state = (Get-WebAppPoolState `
            -Name $siteName).Value

          # 停止 AppPool
          if ($state -eq "Started") {

              Write-Host "Stopping Production AppPool..."

              Stop-WebAppPool `
                -Name $siteName

              $timeout = 30
              $elapsed = 0

              do {
                  Start-Sleep -Seconds 1
                  $elapsed++

                  $state = (Get-WebAppPoolState `
                    -Name $siteName).Value

              } while (
                  $state -ne "Stopped" `
                  -and $elapsed -lt $timeout
              )

              if ($state -ne "Stopped") {
                  Write-Warning "AppPool did not stop."
                  exit 0
              }
          }

          # 切回旧 Release
          Write-Host "Switching IIS back to:"
          Write-Host $oldPath

          Set-ItemProperty `
            "IIS:\Sites\$siteName" `
            -Name physicalPath `
            -Value $oldPath

          # 验证 IIS 路径
          $currentPath = (Get-ItemProperty `
            "IIS:\Sites\$siteName").physicalPath

          if ($currentPath -ne $oldPath) {
              Write-Warning "IIS rollback path verification failed."
              exit 0
          }

          # 启动 AppPool
          Start-WebAppPool `
            -Name $siteName

          Write-Host "Production rollback completed."

      - name: Ensure Production AppPool Running
        if: always()
        shell: powershell
        run: |
          Import-Module WebAdministration

          $appPoolName = "cicd-demo"

          $state = (Get-WebAppPoolState `
            -Name $appPoolName).Value

          Write-Host "Current Production AppPool state: $state"

          if ($state -ne "Started") {

              Write-Host "Attempting to start Production AppPool..."

              try {
                  Start-WebAppPool `
                    -Name $appPoolName
              }
              catch {
                  Write-Warning "Failed to start AppPool:"
                  Write-Warning $_.Exception.Message

                  # 不覆盖原始部署失败
                  exit 0
              }

              $timeout = 30
              $elapsed = 0

              do {
                  Start-Sleep -Seconds 1
                  $elapsed++

                  $state = (Get-WebAppPoolState `
                    -Name $appPoolName).Value

              } while (
                  $state -ne "Started" `
                  -and $elapsed -lt $timeout
              )

              if ($state -ne "Started") {
                  Write-Warning "AppPool could not be started."
                  exit 0
              }
          }

          Write-Host "Production AppPool is running."


name: IIS Deploy

on:
  # ============================================================
  # Reusable Workflow
  #
  # staging / production 都通过 workflow_call 调用这个 Workflow
  # 不在这里写死任何环境名称、站点名称或部署路径
  # ============================================================
  workflow_call:
    inputs:

      # GitHub Environment 名称
      # 例如：staging / production
      environment:
        description: GitHub Environment name
        required: true
        type: string

      # 本次部署使用的 Release ID
      # 由 build Job 生成并传递过来
      release_id:
        description: Release ID
        required: true
        type: string

      # IIS Site 名称
      site_name:
        description: IIS Site name
        required: true
        type: string

      # IIS AppPool 名称
      app_pool_name:
        description: IIS AppPool name
        required: true
        type: string

      deploy_existing_release:
        required: false
        type: boolean
        default: false

      # 是否启用自动 Rollback
      #
      # Production：
      # true
      #
      # Staging：
      # false
      enable_rollback:
        description: Enable automatic rollback
        required: false
        type: boolean
        default: false

      # Release 保留数量
      #
      # 默认保留最近 3 个 Release
      keep_releases:
        description: Number of releases to keep
        required: false
        type: number
        default: 3


jobs:
  deploy:

    # ============================================================
    # 使用 Windows Self-hosted Runner
    #
    # 因为后面的部署步骤需要：
    # - IIS
    # - WebAdministration
    # - PowerShell
    # ============================================================
    runs-on: self-hosted

    # ============================================================
    # GitHub Environment
    #
    # inputs.environment 会决定实际使用：
    #
    # staging
    # production
    #
    # Production 如果配置了 Required reviewers，
    # GitHub 会在这里要求审批。
    # ============================================================
    environment:
      name: ${{ inputs.environment }}

    steps:

      # ============================================================
      # 1. 下载 Build Job 生成的 Artifact
      #
      # build Job 会先生成：
      #
      # cicd-demo
      #
      # 这里把 Artifact 下载到：
      #
      # ./deploy
      #
      # 后面的 Deploy Files 会从这里复制文件。
      # ============================================================
      - name: Download Artifact
        if: inputs.deploy_existing_release == false
        uses: actions/download-artifact@v4
        with:
          name: cicd-demo
          path: ./deploy


      # ============================================================
      # 2. 停止 IIS AppPool
      #
      # 部署前先停止 AppPool，避免文件正在被应用程序占用。
      #
      # 如果 AppPool 本来就是停止状态，则不重复停止。
      #
      # 最多等待 30 秒确认 AppPool 已经停止。
      # ============================================================
      - name: Stop AppPool
        shell: powershell
        run: |
          Import-Module WebAdministration

          $appPoolName = "${{ inputs.app_pool_name }}"

          $state = (Get-WebAppPoolState `
            -Name $appPoolName).Value

          if ($state -eq "Started") {

              Write-Host "Stopping AppPool: $appPoolName"

              Stop-WebAppPool `
                -Name $appPoolName

              $timeout = 30
              $elapsed = 0

              do {
                  Start-Sleep -Seconds 1
                  $elapsed++

                  $state = (Get-WebAppPoolState `
                    -Name $appPoolName).Value

              } while (
                  $state -ne "Stopped" `
                  -and $elapsed -lt $timeout
              )

              if ($state -ne "Stopped") {
                  throw "AppPool did not stop."
              }
          }
          else {
              Write-Host "AppPool already stopped."
          }

      # 👇 就放这里
      - name: Show Environment Variables
        shell: powershell
        run: |
          Write-Host "Environment: ${{ inputs.environment }}"
          Write-Host "APP_ENV: ${{ vars.APP_ENV }}"
          Write-Host "DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}"
          Write-Host "HEALTH_URL: ${{ vars.HEALTH_URL }}"

      - name: Test Environment Secret
        shell: powershell
        run: |
          if ([string]::IsNullOrEmpty("${{ secrets.DEPLOY_TOKEN }}")) {
            throw "DEPLOY_TOKEN is missing"
          }

          Write-Host "DEPLOY_TOKEN is configured"

      # ============================================================
      # 3. 创建新的 Release 并复制部署文件
      #
      # 目录结构：
      #
      # deploy_path
      # └── releases
      #     ├── 27
      #     ├── 28
      #     └── 29   ← 本次部署
      #
      # release_id 来自 build Job。
      #
      # 同一个 release_id 会被：
      #
      # build
      #   ↓
      # staging
      #   ↓
      # production
      #
      # 使用，确保 Production 部署的就是 Staging 验证过的版本。
      # ============================================================
      - name: Deploy Files
        if: inputs.deploy_existing_release == false
        shell: powershell
        run: |
          $source = Join-Path `
            $env:GITHUB_WORKSPACE `
            "deploy"

          $basePath = "${{ vars.DEPLOY_PATH }}"

          $releasesPath = Join-Path `
            $basePath `
            "releases"

          $releaseId = "${{ inputs.release_id }}"

          $releasePath = Join-Path `
            $releasesPath `
            $releaseId

          Write-Host "Release ID:"
          Write-Host $releaseId

          Write-Host "Release Path:"
          Write-Host $releasePath

          # 创建 Release 目录
          New-Item `
            -ItemType Directory `
            -Path $releasePath `
            -Force | Out-Null

          # 复制 Artifact 文件
          Copy-Item `
            -Path "$source\*" `
            -Destination $releasePath `
            -Recurse `
            -Force

          # 基础部署验证：
          # ASP.NET Core IIS 部署必须存在 web.config
          $webConfig = Join-Path `
            $releasePath `
            "web.config"

          if (-not (Test-Path $webConfig)) {
              throw "web.config not found."
          }

          Write-Host "Release validation passed."

      - name: Validate Existing Release
        if: inputs.deploy_existing_release == true
        shell: powershell
        run: |
          $basePath = "${{ vars.DEPLOY_PATH }}"

          $releasePath = Join-Path `
            $basePath `
            "releases\${{ inputs.release_id }}"

          Write-Host "Existing Release Path:"
          Write-Host $releasePath

          if (-not (Test-Path $releasePath)) {
              throw "Release does not exist: $releasePath"
          }

          $webConfig = Join-Path `
            $releasePath `
            "web.config"

          if (-not (Test-Path $webConfig)) {
              throw "web.config not found: $webConfig"
          }

          Write-Host "Existing release validation passed."

      # ============================================================
      # 4. 读取 Release Manifest
      #
      # 自动部署：
      #   release.json 随 Artifact 一起部署
      #
      # 手动重新部署：
      #   release.json 已经存在于旧 Release 中
      #
      # 两种情况都进行验证。
      # ============================================================
      - name: Read Release Manifest
        shell: powershell
        run: |
          $basePath = "${{ vars.DEPLOY_PATH }}"

          $releasePath = Join-Path `
            $basePath `
            "releases\${{ inputs.release_id }}"

          $manifestPath = Join-Path `
            $releasePath `
            "release.json"

          Write-Host "Release Manifest:"
          Write-Host $manifestPath

          if (-not (Test-Path $manifestPath)) {
              throw "release.json not found: $manifestPath"
          }

          $manifest = Get-Content `
            -Path $manifestPath `
            -Raw |
            ConvertFrom-Json

          Write-Host "========================================"
          Write-Host "Release Information"
          Write-Host "========================================"

          Write-Host "Release ID:     $($manifest.releaseId)"
          Write-Host "Commit SHA:     $($manifest.commitSha)"
          Write-Host "Branch:         $($manifest.branch)"
          Write-Host "Workflow Run:   $($manifest.workflowRunId)"
          Write-Host "Created By:     $($manifest.createdBy)"
          Write-Host "Created At:     $($manifest.createdAt)"

          Write-Host "========================================"

          if ("$($manifest.releaseId)" -ne "${{ inputs.release_id }}") {
              throw "Release ID mismatch."
          }

          Write-Host "Release manifest validation passed."

      # ============================================================
      # 4. 切换 IIS 到新的 Release
      #
      # 例如：
      #
      # 原来：
      # C:\Deploy\...\releases\28
      #
      # 切换成：
      # C:\Deploy\...\releases\29
      #
      # 在切换之前先保存旧路径。
      #
      # 如果后面的 Health Check 失败，
      # Rollback 会使用这个旧路径恢复。
      # ============================================================
      - name: Switch IIS
        shell: powershell
        run: |
          Import-Module WebAdministration

          $siteName = "${{ inputs.site_name }}"

          $basePath = "${{ vars.DEPLOY_PATH }}"

          $releaseId = "${{ inputs.release_id }}"

          $releasePath = Join-Path `
            $basePath `
            "releases\$releaseId"

          # 获取当前 IIS Site 的物理路径
          $oldPath = (Get-ItemProperty `
            "IIS:\Sites\$siteName").physicalPath

          Write-Host "Old IIS Path:"
          Write-Host $oldPath

          Write-Host "New IIS Path:"
          Write-Host $releasePath

          # 保存旧 Release 路径
          #
          # 后面的 Rollback Step 可以通过
          # $env:OLD_RELEASE_PATH 获取。
          "OLD_RELEASE_PATH=$oldPath" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append

          # 切换 IIS Site 到新 Release
          Set-ItemProperty `
            "IIS:\Sites\$siteName" `
            -Name physicalPath `
            -Value $releasePath

          # 再次读取 IIS 路径进行验证
          $currentPath = (Get-ItemProperty `
            "IIS:\Sites\$siteName").physicalPath

          if ($currentPath -ne $releasePath) {
              throw "IIS switch failed."
          }

          # 标记 IIS 已经成功切换
          #
          # Rollback 只有在 IIS 已经成功切换之后才允许执行。
          "IIS_SWITCHED=true" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Append

          Write-Host "IIS switched successfully."


      # ============================================================
      # 5. 启动 IIS AppPool
      #
      # IIS 已经切换到新的 Release 后，
      # 启动 AppPool。
      #
      # 最多等待 30 秒确认 AppPool 成功启动。
      # ============================================================
      - name: Start AppPool
        shell: powershell
        run: |
          Import-Module WebAdministration

          $appPoolName = "${{ inputs.app_pool_name }}"

          Start-WebAppPool `
            -Name $appPoolName

          $timeout = 30
          $elapsed = 0

          do {
              Start-Sleep -Seconds 1
              $elapsed++

              $state = (Get-WebAppPoolState `
                -Name $appPoolName).Value

          } while (
              $state -ne "Started" `
              -and $elapsed -lt $timeout
          )

          if ($state -ne "Started") {
              throw "AppPool did not start."
          }

          Write-Host "AppPool started."


      # ============================================================
      # 6. Health Check
      #
      # 部署完成后检查应用是否真正可以访问。
      #
      # 如果 GitHub Environment 没有配置 HEALTH_URL，
      #
      # health_url == ""
      #
      # 则跳过这个 Step。
      #
      # 如果连续 10 次检查都失败，则整个部署失败。
      # 每次检查间隔 2 秒。
      # ============================================================
      - name: Health Check
        if: vars.HEALTH_URL != ''
        shell: powershell
        run: |
          $url = "${{ vars.HEALTH_URL }}"

          $maxAttempts = 10
          $attempt = 0
          $success = $false

          while ($attempt -lt $maxAttempts) {

              $attempt++

              Write-Host "Health check attempt: $attempt"

              try {

                  $response = Invoke-WebRequest `
                    -Uri $url `
                    -UseBasicParsing `
                    -TimeoutSec 5

                  if ($response.StatusCode -eq 200) {
                      $success = $true
                      break
                  }

                  Write-Host "Unexpected status code: $($response.StatusCode)"
              }
              catch {

                  Write-Host $_.Exception.Message
              }

              Start-Sleep -Seconds 2
          }

          if (-not $success) {
              throw "Health check failed."
          }

          Write-Host "Health check passed."


      # ============================================================
      # 7. 自动 Rollback
      #
      # 只有同时满足三个条件才执行：
      #
      # ① 前面的步骤发生失败
      # ② 调用方启用了 enable_rollback
      # ③ IIS 已经成功切换
      #
      # Production：
      # enable_rollback = true
      #
      # Staging：
      # enable_rollback = false
      #
      # 因此同一个 Reusable Workflow 可以支持两种策略。
      # ============================================================
      - name: Rollback
        if: failure() && inputs.enable_rollback && env.IIS_SWITCHED == 'true'
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "Starting Rollback"
          Write-Host "========================================"

          Import-Module WebAdministration

          $siteName = "${{ inputs.site_name }}"
          $appPoolName = "${{ inputs.app_pool_name }}"
          $oldPath = $env:OLD_RELEASE_PATH

          Write-Host "========================================"
          Write-Host "             IIS Rollback"
          Write-Host "========================================"

          # 没有旧路径，无法 Rollback
          if ([string]::IsNullOrWhiteSpace($oldPath)) {
              throw "Rollback failed: Old release path is empty."
          }

          Write-Host "Rollback target:"
          Write-Host $oldPath

          # 旧 Release 不存在，无法 Rollback
          if (-not (Test-Path $oldPath)) {
              throw "Rollback failed: Old release does not exist: $oldPath"
          }

          # 获取当前 AppPool 状态
          $state = (Get-WebAppPoolState `
            -Name $appPoolName).Value

          # 如果 AppPool 正在运行，则先停止
          if ($state -eq "Started") {

              Write-Host "Stopping AppPool..."

              Stop-WebAppPool `
                -Name $appPoolName

              $timeout = 30
              $elapsed = 0

              do {
                  Start-Sleep -Seconds 1
                  $elapsed++

                  $state = (Get-WebAppPoolState `
                    -Name $appPoolName).Value

              } while (
                  $state -ne "Stopped" `
                  -and $elapsed -lt $timeout
              )

              if ($state -ne "Stopped") {
                  throw "Rollback failed: AppPool did not stop."
              }
          }

          # 切回旧 Release
          Write-Host "Switching IIS back to:"
          Write-Host $oldPath

          Set-ItemProperty `
            "IIS:\Sites\$siteName" `
            -Name physicalPath `
            -Value $oldPath

          # 验证 Rollback 后 IIS 路径
          $currentPath = (Get-ItemProperty `
            "IIS:\Sites\$siteName").physicalPath

          if ($currentPath -ne $oldPath) {
              throw "Rollback failed: IIS rollback path verification failed. Expected: $oldPath, Actual: $currentPath"
          }

          # 启动 AppPool
          Start-WebAppPool `
            -Name $appPoolName

          Write-Host "IIS rollback completed."


      # ============================================================
      # 8. 清理旧 Release
      #
      # 默认保留最近 3 个 Release。
      #
      # 例如当前有：
      #
      # 30
      # 29
      # 28
      # 27
      # 26
      #
      # keep_releases = 3
      #
      # 最终保留：
      #
      # 30
      # 29
      # 28
      #
      # 删除：
      #
      # 27
      # 26
      #
      # Staging / Production 都可以使用。
      # ============================================================
      - name: Cleanup Old Releases
        shell: powershell
        if: success()
        run: |
          $basePath = "${{ vars.DEPLOY_PATH }}"
          $releasesPath = Join-Path $basePath "releases"
          $keepReleases = [int]${{ inputs.keep_releases }}
          $currentReleaseId = "${{ inputs.release_id }}"

          Write-Host "Releases path:"
          Write-Host $releasesPath

          Write-Host "Keep releases:"
          Write-Host $keepReleases

          Write-Host "Current release:"
          Write-Host $currentReleaseId

          if (-not (Test-Path $releasesPath)) {
              Write-Host "Releases directory does not exist. Skip cleanup."
              exit 0
          }

          # 只处理名称为纯数字的 Release 目录
          $releases = Get-ChildItem `
            -Path $releasesPath `
            -Directory |
            Where-Object {
                $_.Name -match '^\d+$'
            } |
            Sort-Object {
                [int64]$_.Name
            } -Descending

          Write-Host "Found numeric releases:"
          $releases | ForEach-Object {
              Write-Host "  $($_.Name)"
          }

          # 最新的 N 个 Release 保留
          $releasesToKeep = $releases |
            Select-Object -First $keepReleases

          # 当前正在运行的 Release 无论新旧，都必须保留
          $releasesToKeep = @(
              $releasesToKeep
              $releases | Where-Object {
                  $_.Name -eq $currentReleaseId
              }
          ) | Sort-Object Name -Unique

          Write-Host "Releases that will be kept:"
          $releasesToKeep | ForEach-Object {
              Write-Host "  $($_.Name)"
          }

          # 删除不需要保留的 Release
          $releasesToDelete = $releases | Where-Object {
              $keepNames = $releasesToKeep.Name
              $_.Name -notin $keepNames
          }

          foreach ($release in $releasesToDelete) {
              Write-Host "Deleting old release: $($release.FullName)"

              Remove-Item `
                -Path $release.FullName `
                -Recurse `
                -Force
          }

          Write-Host "Release cleanup completed."


      # ============================================================
      # 9. 最终确保 AppPool 正常运行
      #
      # always() 表示：
      #
      # 不管前面的部署成功还是失败，
      # 这个 Step 都尝试执行。
      #
      # 目的：
      #
      # 防止部署过程中发生异常，
      # 最后 AppPool 仍然停在那里。
      #
      # 注意：
      # 如果启动失败，这里只 Warning + exit 0，
      # 不覆盖前面真正的部署失败原因。
      # ============================================================
      - name: Ensure AppPool Running
        if: always()
        shell: powershell
        run: |
          Import-Module WebAdministration

          $appPoolName = "${{ inputs.app_pool_name }}"

          $state = (Get-WebAppPoolState `
            -Name $appPoolName).Value

          Write-Host "Current AppPool state: $state"

          if ($state -ne "Started") {

              Write-Host "Attempting to start AppPool..."

              try {
                  Start-WebAppPool `
                    -Name $appPoolName
              }
              catch {
                  Write-Warning "Failed to start AppPool:"
                  Write-Warning $_.Exception.Message

                  # 不覆盖原始部署失败
                  exit 0
              }

              $timeout = 30
              $elapsed = 0

              do {
                  Start-Sleep -Seconds 1
                  $elapsed++

                  $state = (Get-WebAppPoolState `
                    -Name $appPoolName).Value

              } while (
                  $state -ne "Started" `
                  -and $elapsed -lt $timeout
              )

              if ($state -ne "Started") {
                  Write-Warning "AppPool could not be started."
                  exit 0
              }
          }

          Write-Host "AppPool is running."
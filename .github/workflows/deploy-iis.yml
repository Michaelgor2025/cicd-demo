name: Reusable IIS Deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

      release_id:
        required: true
        type: string

      site_name:
        required: true
        type: string

      app_pool_name:
        required: true
        type: string

jobs:
  deploy:
    runs-on: self-hosted

    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: cicd-demo
          path: ./deploy

      - name: Show Deploy Info
        shell: powershell
        run: |
          Write-Host "Environment: ${{ inputs.environment }}"
          Write-Host "Release ID: ${{ inputs.release_id }}"
          Write-Host "Site Name: ${{ inputs.site_name }}"
          Write-Host "AppPool: ${{ inputs.app_pool_name }}"

      - name: Test Artifact
        shell: powershell
        run: |
          Write-Host "Artifact files:"
          Get-ChildItem ./deploy -Recurse